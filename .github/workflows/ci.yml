name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Branches whose pushes are published to GitHub Pages (keep in sync with the deploy job).
env:
  DEPLOY_REFS: '["refs/heads/main", "refs/heads/claude/affectionate-faraday-zn030o"]'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'push' && contains(fromJSON(env.DEPLOY_REFS), github.ref)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/claude/affectionate-faraday-zn030o"]'), github.ref)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
